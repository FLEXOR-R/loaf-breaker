# LOAF BREAKER, TEST REORG (branch reorg): the menus rearranged (HOME to play, EDIT KICK the whole kick, the MIXER's
# MASTER, ENV's KNOB giving SEL + K2 and K4 their function) and TERROR's more (DRIVE, TYPE, SCREECH, TAIL). Every push to
# the reorg branch is a pre-release of its own: test-v9.01, 9.02... (the splash shows the number),
# loaf-breaker-test-X.YY.fwsc and the simulator's screens. The main line (loaf) is untouched.
name: LOAF BREAKER TEST REORG

on:
  push:
    branches: [reorg]
    paths-ignore: ["breaks/tests/**", ".github/workflows/tests.yml"]   # (the break tests' own: tests.yml)
  workflow_dispatch:

permissions:
  contents: write

concurrency:                            # one release at a time, in order: no two runs take the same number
  group: reorg-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        run: |
          # (LOAF BREAKER's loaf-vX.YY tags go on from GLOUPI BREAKS' gloupi-vX.YY: one count)
          TAGS="$(git ls-remote --tags origin 'refs/tags/test-v*' | sed 's|\^{}$||')"
          V="$(printf '%s\n' "$TAGS" | grep "^$GITHUB_SHA" | sed 's|.*refs/tags/[a-z]*-v||' | head -1)"
          if [ -z "$V" ]; then
            LAST="$(printf '%s\n' "$TAGS" | sed -n 's|.*refs/tags/[a-z]*-v||p' | grep -E '^[0-9]+\.[0-9]{2,}$' \
                    | sort -t. -k1,1n -k2,2n | tail -1)"
            if [ -z "$LAST" ]; then
              V=9.01
            else
              MAJ="${LAST%%.*}"; MIN=$((10#${LAST#*.} + 1))
              V="$(printf '%d.%02d' "$MAJ" "$MIN")"
            fi
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "LOAF BREAKER $V" >> "$GITHUB_STEP_SUMMARY"

      - name: Pillow with raqm (the build's fonts)
        run: |
          raqm() { /usr/bin/python3 -c 'from PIL import features; raise SystemExit(not features.check("raqm"))' 2>/dev/null; }
          raqm || /usr/bin/python3 -m pip install -q --user --break-system-packages Pillow
          raqm || { sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0; }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: fm1-base, JieLi toolchain and AC79 SDK files
        env:
          PYTHON: /usr/bin/python3
          BOOTSTRAP_USB: 0
        run: sh scripts/bootstrap.sh

      - name: Engine tests
        run: ./build.sh test

      - name: Firmware
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --release "$VERSION" | tee build.log
          mv "app/build/choppah-$VERSION.fwsc" "app/build/loaf-breaker-test-$VERSION.fwsc"
          { echo '```'; grep -i -E 'image|flash|bank|slot' build.log | tail -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Size report   # (LOAF BREAKER: what takes the room, tools/size_report.py; its failing stops nothing)
        continue-on-error: true
        run: |
          ELF="$(find app/build -maxdepth 3 -name '*.elf' ! -path '*host*' | grep -v loader | head -1)"
          OD="$HOME/.jieli/toolchain/common/bin/objdump"
          echo "elf: $ELF"
          "$OD" -h "$ELF" > app/build/sections.txt
          "$OD" -t "$ELF" > app/build/symbols.txt
          IMG="$(grep -o 'ok    image [0-9]* B' build.log | grep -o '[0-9][0-9]*' | head -1)"
          /usr/bin/python3 tools/size_report.py app/build/sections.txt app/build/symbols.txt $IMG \
            | tee "app/build/loaf-breaker-test-size-$VERSION.txt"
          { echo '```'; head -60 "app/build/loaf-breaker-test-size-$VERSION.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Screens from the host simulator   # (a scenario failing fails the run: no release of a build that crashes)
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --host --release "$VERSION"   # (the number on its screens too)
          mkdir -p screens
          H="$(ls app/build/host/*_host | head -1)"
          bad=""
          for sc in ui kick64 lanes seq pads subdrive skins arp clap terror cross track fxmem kfx knob halflatch cdj maxout reorg; do "$H" tests/scenarios/$sc.txt screens || bad="$bad $sc"; done
          # (LOAF BREAKER: the update loader's screen, its drawing on a stand-in panel)
          cc -std=c99 -Wall -I tests/loader/src tests/loader/src/preview.c -o app/build/ldr_preview \
            && (cd screens && ../app/build/ldr_preview) \
            && /usr/bin/python3 -c 'import sys; from PIL import Image; [Image.open(f"screens/{n}.ppm").save(f"screens/{n}.png") for n in ("ldr_wait", "ldr_0", "ldr_50", "ldr_lost", "ldr_100", "ldr_done")]' \
            && rm -f screens/*.ppm || bad="$bad loader"
          ls screens
          (cd screens && zip -q -r "../app/build/loaf-breaker-test-screens-$VERSION.zip" .)
          [ -z "$bad" ] || { echo "::error::scenarios failed:$bad"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ env.VERSION }}
          path: screens/
          if-no-files-found: ignore

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: LOAF BREAKER TEST REORG ${{ env.VERSION }}
          body: |
            **FIRMWARE DE TEST** (le firmware principal loaf-v… n'est pas touché). Installe loaf-breaker-test-${{ env.VERSION }}.fwsc avec l'installateur web de fm1-base (Chrome ou Edge, le FM-1 en USB) ; le splash affiche ${{ env.VERSION }}. Pour revenir en arrière : réinstalle la dernière loaf-v….

            ## Tuto : les menus réorganisés

            **1. HOME = jouer.** HOME alterne PERFORM et GENERATOR (la waveform par défaut ; HOME maintenu : les slices). KICK EQ et KICK FX n'y sont plus.

            **2. EDIT KICK = tout le kick.** EDIT, puis ALGORITHM fait défiler les parties : MIX, SUB, SUB FX, PUNCH, PUNCH FX, GRIT, GRIT FX, CLICK, CLICK FX, MACRO, OUT, puis les nouvelles :
            - **EQ BANDS** et **EQ SHAPE** : l'ancien KICK EQ.
            - **FX 1** et **FX 2** : l'ancien KICK FX (PRESETS l'effet, FX les pages MAIN / MORE / MOD, SEL + FX bypass, SEL ×2 reset).
            - **TERROR** : AMOUNT, SUB, FIZZ, SUSTAIN.
            - **TERROR +** (nouveau, à tester) : **DRIVE** (la violence, à part du mélange), **TYPE** (FOLD le cri, CLIP carré, CRUSH en marches), **SCREECH** (une bande résonante 500 Hz–5 kHz : le sifflement ; OFF tout à gauche), **TAIL** (la disto qui meurt vite, ou qui reste entre deux kicks).
            - **TERROR 2** : AMOUNT, SUB, SCREAM, PUSH.
            Ces réglages sont ceux du kick : ils suivent sa mémoire (KICK 1–10).

            **3. LFO (MIXER) = le mix.** LFO alterne LEVELS, GROOVE et le nouveau **MASTER** : K1 COMP (le seuil, comme SEL + K3), K2 son RATIO, K3 DUCK (comme SEL + K1), K4 **MAX OUT** (quitté de GLO › MORE). Le fader COMP a son vumètre de réduction à côté.

            **4. ENV = le morceau et le live.** TRACKS, PLAY, DROP, **KNOB**.
            - Sur KNOB, ALGORITHM choisit le knob (K1 DUCK, K2, K3 COMP, K4).
            - **Sur K2 ou K4, PRESETS choisit ce que fait SEL + ce knob** : TERROR 2, TERROR ou **DRIVE** (l'INTENSITY du kick, son MACRO). Par défaut K2 = TERROR 2, K4 = TERROR. K1 (DUCK) et K3 (COMP) restent fixes.

            **5. GLO › MORE** ne garde que SKIN et AUTO SAVE.

            ## À tester
            1. Les parties du kick dans EDIT : est-ce plus clair d'avoir EQ / FX / TERROR là qu'en HOME ?
            2. **TERROR +** sur un kick ROTTERDAM ou DISTORTO, TERROR à 60 % : essaie TYPE (FOLD / CLIP / CRUSH), puis SCREECH entre 1 et 3 kHz, puis TAIL à fond (+50) et tout à gauche (-50), puis DRIVE. Note ce qui colle à l'esthétique terror et ce qui ne sert à rien.
            3. SEL + K2 en DRIVE (ENV › KNOB, K2, PRESETS) pendant que ça joue.
            4. Le MASTER du MIXER : COMP + MAX OUT au même endroit.

            Dis-moi ce que tu gardes, j'intègre au firmware principal.
          generate_release_notes: true
          make_latest: false
          prerelease: true
          files: |
            app/build/loaf-breaker-test-${{ env.VERSION }}.fwsc
            app/build/loaf-breaker-test-screens-${{ env.VERSION }}.zip
            app/build/loaf-breaker-test-size-${{ env.VERSION }}.txt
