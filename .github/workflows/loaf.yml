# LOAF BREAKER (was GLOUPI BREAKS): CHOPPAH modified by FLEXOR, its own name, screens and eight breaks.
# Every push to the loaf branch (was gloupi) (or Actions → LOAF BREAKER → Run workflow) is a release of its own, kept: the last
# gloupi-vX.YY tag + 0.01 (the first 0.02: 0.01 was the "gloupi" pre-release; after 0.99 come 0.100, 0.101 ...: never
# 1.00), the number on the splash, the release
# loaf-vX.YY with loaf-breaker-X.YY.fwsc and the host simulator's screens (loaf-breaker-screens-X.YY.zip). A re-run of a
# commit already released builds the same number again.
# A push to dev (FLEXOR, 12 Nov 2026: not twenty public versions a day) is a TEST: the same build and scenarios, no
# site, no soak, no loaf-v tag, and one draft release only, LOAF BREAKER TEST, replaced at each push, with
# loaf-breaker-A.B.C-testN.fwsc (a draft: the Firmware Hub, which looks at the newest release, pre-releases too, never sees it)
# (A.B.C the next release's number, N the commits on dev since loaf; its splash "A.B.C TEST N"). A release is dev merged
# into loaf, when FLEXOR says so.
name: LOAF BREAKER

on:
  push:
    branches: [loaf, dev]
    paths-ignore: ["breaks/tests/**", ".github/workflows/tests.yml", "CLAUDE.md"]   # (the break tests' own: tests.yml)
  workflow_dispatch:

permissions:
  contents: write
  pages: write                          # (the site, when GitHub Pages is on for the repository)
  id-token: write

env:
  EMSDK_VERSION: 3.1.74                 # the browser emulator's Emscripten (as CHOPPAH's pages.yml)

concurrency:                            # one release at a time, in order: no two runs take the same number
  group: loaf-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0                # (dev: its commits since loaf counted)

      - name: Version
        run: |
          # (LOAF BREAKER's numbers: A.B.C since 0.9.1 (FLEXOR, 12 Nov 2026), the last tag's patch + 1, ./LOAF_FROM the
          # lowest the next may be (1.0.0 there for 1.0.0); before, X.YY up to 0.267. The package's own number, always
          # higher than the last: scripts/loaf_version.sh)
          scripts/loaf_version.sh check
          TAGS="$(git ls-remote --tags origin 'refs/tags/loaf-v*' 'refs/tags/gloupi-v*' | sed 's|\^{}$||')"
          V="$(printf '%s\n' "$TAGS" | grep "^$GITHUB_SHA" | sed 's|.*refs/tags/[a-z]*-v||' | head -1)"
          [ -n "$V" ] && [ "$GITHUB_REF_NAME" = loaf ] || V="$(scripts/loaf_version.sh next $(printf '%s\n' "$TAGS" | sed -n 's|.*refs/tags/[a-z]*-v||p'))"
          PKG="$(scripts/loaf_version.sh pkg "$V")"
          SHOW="$V"
          if [ "$GITHUB_REF_NAME" = dev ]; then   # (a TEST: the next release's number, its commits since loaf)
            N="$(git rev-list --count origin/loaf..HEAD)"
            SHOW="$V TEST $N"; V="$V-test$N"
            echo "TEST=1" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          printf '#define LOAF_VERSION "%s"\n' "$SHOW" > app/loaf_version.h
          echo "LOAF BREAKER $SHOW" >> "$GITHUB_STEP_SUMMARY"

      - name: Pillow with raqm (the build's fonts)
        run: |
          raqm() { /usr/bin/python3 -c 'from PIL import features; raise SystemExit(not features.check("raqm"))' 2>/dev/null; }
          raqm || /usr/bin/python3 -m pip install -q --user --break-system-packages Pillow
          raqm || { sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0; }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: fm1-base, JieLi toolchain and AC79 SDK files
        env:
          PYTHON: /usr/bin/python3
          BOOTSTRAP_USB: 0
        run: sh scripts/bootstrap.sh

      - name: Engine tests
        run: ./build.sh test

      # Emscripten for the site's browser emulator, installed by hand and cached (as CHOPPAH's pages.yml)
      - uses: actions/cache@v4
        if: env.TEST != '1'
        id: emsdk
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Emscripten ${{ env.EMSDK_VERSION }}
        if: env.TEST != '1'
        run: |
          if [ "${{ steps.emsdk.outputs.cache-hit }}" != true ]; then
            git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
            "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
            "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
            rm -rf "$HOME/emsdk/downloads"
          fi
          . "$HOME/emsdk/emsdk_env.sh" >/dev/null 2>&1
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          emcc --version | head -1

      - name: Firmware
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --release "$PKG" | tee build.log
          mv "app/build/loaf-breaker-$PKG.fwsc" "app/build/loaf-breaker-$VERSION.fwsc"
          { echo '```'; grep -i -E 'image|flash|bank|slot' build.log | tail -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Size report   # (LOAF BREAKER: what takes the room, tools/size_report.py; its failing stops nothing)
        continue-on-error: true
        run: |
          ELF="$(find app/build -maxdepth 3 -name '*.elf' ! -path '*host*' | grep -v loader | head -1)"
          OD="$HOME/.jieli/toolchain/common/bin/objdump"
          echo "elf: $ELF"
          "$OD" -h "$ELF" > app/build/sections.txt
          "$OD" -t "$ELF" > app/build/symbols.txt
          IMG="$(grep -o 'ok    image [0-9]* B' build.log | grep -o '[0-9][0-9]*' | head -1)"
          /usr/bin/python3 tools/size_report.py app/build/sections.txt app/build/symbols.txt $IMG \
            | tee "app/build/loaf-breaker-size-$VERSION.txt"
          { echo '```'; head -60 "app/build/loaf-breaker-size-$VERSION.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Screens from the host simulator   # (a scenario failing fails the run: no release of a build that crashes)
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --host --release "$PKG"   # (the number on its screens too: LOAF_VERSION's)
          mkdir -p screens
          H="$(ls app/build/host/*_host | head -1)"
          bad=""
          for sc in ui kick64 lanes seq pads subdrive skins arp clap terror cross track fxmem kfx knob halflatch cdj maxout reorg drops reset synth kickmenu kroll hits trkgap trkfrom loaftest audition kreset drumbig kpreset autosave effects trkempty lfomix wavezoom sfxset sellock trkflt kill kicktools kickknob kickknobs cleanmorph novice seqtools kickcopy dropkick knobstyle pat64 overlay domains knobpre klab kview kfocus tutorial ezoom fxround magic fxeasy drumview brkview beginner drumfx blackkeys tutaway breaktime selfoot wipe editround kick20 hset trknovice dstkick homekick kfxkick clip selcombo trkdel dropstut gapkeep padlatch bkalgo ovlsync frzlatch keylen arpthru rollrate drum64 seqfollow; do "$H" tests/scenarios/$sc.txt screens || bad="$bad $sc"; done
          LOAF_ASK=1 "$H" tests/scenarios/firstboot.txt screens || bad="$bad firstboot"   # (the first start's question)
          LOAF_ASK=1 "$H" tests/scenarios/resetask.txt screens || bad="$bad resetask"   # (RESET ALL: as a first start)
          # (LOAF BREAKER: the update loader's screen, its drawing on a stand-in panel)
          cc -std=c99 -Wall -I tests/loader/src tests/loader/src/preview.c -o app/build/ldr_preview \
            && (cd screens && ../app/build/ldr_preview) \
            && /usr/bin/python3 -c 'import sys; from PIL import Image; [Image.open(f"screens/{n}.ppm").save(f"screens/{n}.png") for n in ("ldr_wait", "ldr_0", "ldr_50", "ldr_lost", "ldr_100", "ldr_done")]' \
            && rm -f screens/*.ppm || bad="$bad loader"
          ls screens
          (cd screens && zip -q -r "../app/build/loaf-breaker-screens-$VERSION.zip" .)
          [ -z "$bad" ] || { echo "::error::scenarios failed:$bad"; exit 1; }

      - name: Your break (the custom break over SysEx; the site's page makes it as prep_breaks.py)   # (0.9.32, CHOPPAH 1.4's)
        run: |
          sh tests/custom_break.sh
          sh tests/page_parity.sh
          sh tests/lib_same.sh

      # LOAF BREAKER's site, as CHOPPAH's: the front page, the web installer, the emulator in the browser and the
      # manual, its screenshots taken from this build (tools/site_shots.sh), in CHOPPAH's look (tools/site_style.py)
      - name: Site (front page, installer, emulator, manual)
        if: env.TEST != '1'
        env:
          PYTHON: /usr/bin/python3
        run: |
          sh tools/site_shots.sh || echo "::warning::site_shots: a screenshot missing, the committed one kept"
          ./build.sh --web --release "$PKG"
          cp "app/build/loaf-breaker-$VERSION.fwsc" "app/build/loaf-breaker-$PKG.fwsc"   # (make_site's name for it)
          /usr/bin/python3 base/tools/make_site.py app "app/build/loaf-breaker-$PKG.fwsc" "$VERSION" site
          /usr/bin/python3 tools/site_style.py site
          # (public since 0.261, FLEXOR: the firmware on the site open, no install code)
          (cd site && zip -q -r "../app/build/loaf-breaker-site-$VERSION.zip" .)

      - uses: actions/upload-pages-artifact@v3
        if: env.TEST != '1'
        with:
          path: site

      - name: Soak (30 minutes of random play in the simulator)   # (a crash, a hang or silence at the end fails the run)
        if: env.TEST != '1'
        run: |
          S=$(( ${{ github.run_number }} % 1000 ))
          echo "soak seed $S (again: python3 tools/soak.py --minutes 30 --seed $S)"
          python3 tools/soak.py --minutes 30 --seed $S > app/build/soak.txt
          mkdir -p app/build/soak
          H="$(ls app/build/host/*_host | head -1)"
          rc=0; "$H" app/build/soak.txt app/build/soak > app/build/soak.log 2>&1 || rc=$?
          tail -3 app/build/soak.log; grep FAIL app/build/soak.log || true
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ env.VERSION }}
          path: screens/
          if-no-files-found: ignore

      - name: TEST draft release (dev, the one before it replaced)
        if: env.TEST == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (a draft: only the repository's owner sees it; the Firmware Hub, which looks at the newest release, pre-releases
          # too, never does. 0.9.1's TEST pre-release, zipped, made the hub's check miss the .fwsc: FLEXOR, 12 Nov 2026)
          gh release delete loaf-test --cleanup-tag -y || true
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" -q '.[] | select(.draft and (.name | startswith("LOAF BREAKER TEST"))) | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release create loaf-test --draft --target "$GITHUB_SHA" \
            --title "LOAF BREAKER TEST ($VERSION)" \
            --notes "A test build of the work in progress on dev ($(git rev-parse --short HEAD)), not a release (a draft: only the owner sees it): install loaf-breaker-$VERSION.fwsc with the web installer; the splash shows TEST. Replaced at the next push to dev." \
            "app/build/loaf-breaker-$VERSION.fwsc"

      - uses: softprops/action-gh-release@v2
        if: env.TEST != '1'
        with:
          tag_name: loaf-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: LOAF BREAKER ${{ env.VERSION }}
          body: |
            Install loaf-breaker-${{ env.VERSION }}.fwsc with fm1-base's web installer (Chrome or Edge, the FM-1 on
            USB); the splash shows ${{ env.VERSION }}. loaf-breaker-site-${{ env.VERSION }}.zip: the site (front page,
            installer, emulator, manual), open its index.html; loaf-breaker-screens-${{ env.VERSION }}.zip: the
            simulator's screens.
          generate_release_notes: true
          make_latest: true
          files: |
            app/build/loaf-breaker-${{ env.VERSION }}.fwsc
            app/build/loaf-breaker-screens-${{ env.VERSION }}.zip
            app/build/loaf-breaker-site-${{ env.VERSION }}.zip
            app/build/loaf-breaker-size-${{ env.VERSION }}.txt

  # The site on GitHub Pages, once Pages is on for the repository (Settings → Pages → Source: GitHub Actions). Until
  # then this job fails on its own and the release above stands.
  pages:
    needs: build
    if: github.ref_name == 'loaf'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
