# One-off (FLEXOR, 10 Nov 2026): every tag rewritten without the GLOUPI BREAKS start-up photo (art/gloupi_logo.png,
# its pixels app/logo_data.h, its converter tools/make_logo.py). The branches were rewritten from a Claude Code session,
# whose git proxy refuses to push tags; this does the tags on GitHub's side, by hand only:
# Actions → PURGE START-UP PHOTO → Run workflow, typing PURGE. It stops, pushing nothing, if a branch on GitHub isn't
# already the clean one, and checks every tag afterwards. Run once; it can be deleted after.
name: PURGE START-UP PHOTO

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PURGE to rewrite every tag without the start-up photo"
        required: true

permissions:
  contents: write

concurrency:
  group: loaf-release                   # (not while a release runs)
  cancel-in-progress: false

jobs:
  purge:
    if: github.event.inputs.confirm == 'PURGE'
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite the tags without the photo and push them
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          pipx install git-filter-repo
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git clone --quiet --mirror "$url" repo.git
          cd repo.git
          git filter-repo --force --invert-paths --path art/gloupi_logo.png --path app/logo_data.h --path tools/make_logo.py
          left=$(git rev-list --all --objects | grep -cE 'art/gloupi_logo.png|app/logo_data.h|tools/make_logo.py' || true)
          echo "photo objects left after the rewrite: $left"
          [ "$left" = 0 ]
          git remote add origin "$url"
          for b in $(git for-each-ref --format='%(refname:short)' refs/heads); do   # (the branches: already clean)
            r=$(git ls-remote origin "refs/heads/$b" | cut -f1)
            l=$(git rev-parse "refs/heads/$b")
            if [ "$r" != "$l" ]; then
              echo "::error::branch $b on GitHub is not the clean one: nothing pushed"
              exit 1
            fi
          done
          git push --force --tags origin
          bad=0
          for t in $(git for-each-ref --format='%(refname)' refs/tags); do
            r=$(git ls-remote origin "$t" | head -1 | cut -f1)
            l=$(git rev-parse "$t")
            [ "$r" = "$l" ] || { echo "::error::tag $t not updated"; bad=1; }
          done
          [ "$bad" = 0 ]
          echo "Every tag rewritten: the start-up photo is in no branch and no tag."
