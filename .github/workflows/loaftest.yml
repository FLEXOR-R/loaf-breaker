# LOAF BREAKER TEST (branch loaf-test): the interface lighter and measured: GLO MORE's METER (the audio's load, the
# screen's strips and the passes a second), the CDJ view and the MIXER at 20 frames a second, the kick's picture worked
# out at most every 100 ms while turning, a pass's changes applied once. Every push to loaf-test is a pre-release of its
# own: test-vX.YY. The main line (loaf) is untouched.
name: LOAF BREAKER TEST

on:
  push:
    branches: [loaf-test]
    paths-ignore: ["breaks/tests/**", ".github/workflows/tests.yml"]   # (the break tests' own: tests.yml)
  workflow_dispatch:

permissions:
  contents: write

concurrency:                            # one release at a time, in order: no two runs take the same number
  group: loaf-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        run: |
          # (LOAF BREAKER's loaf-vX.YY tags go on from GLOUPI BREAKS' gloupi-vX.YY: one count)
          TAGS="$(git ls-remote --tags origin 'refs/tags/test-v*' | sed 's|\^{}$||')"
          V="$(printf '%s\n' "$TAGS" | grep "^$GITHUB_SHA" | sed 's|.*refs/tags/[a-z]*-v||' | head -1)"
          if [ -z "$V" ]; then
            LAST="$(printf '%s\n' "$TAGS" | sed -n 's|.*refs/tags/[a-z]*-v||p' | grep -E '^[0-9]+\.[0-9]{2,}$' \
                    | sort -t. -k1,1n -k2,2n | tail -1)"
            if [ -z "$LAST" ]; then
              V=9.01
            else
              MAJ="${LAST%%.*}"; MIN=$((10#${LAST#*.} + 1))
              V="$(printf '%d.%02d' "$MAJ" "$MIN")"
            fi
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "LOAF BREAKER $V" >> "$GITHUB_STEP_SUMMARY"

      - name: Pillow with raqm (the build's fonts)
        run: |
          raqm() { /usr/bin/python3 -c 'from PIL import features; raise SystemExit(not features.check("raqm"))' 2>/dev/null; }
          raqm || /usr/bin/python3 -m pip install -q --user --break-system-packages Pillow
          raqm || { sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0; }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: fm1-base, JieLi toolchain and AC79 SDK files
        env:
          PYTHON: /usr/bin/python3
          BOOTSTRAP_USB: 0
        run: sh scripts/bootstrap.sh

      - name: Engine tests
        run: ./build.sh test

      - name: Firmware
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --release "$VERSION" | tee build.log
          mv "app/build/loaf-breaker-$VERSION.fwsc" "app/build/loaf-breaker-test-$VERSION.fwsc"
          { echo '```'; grep -i -E 'image|flash|bank|slot' build.log | tail -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Size report   # (LOAF BREAKER: what takes the room, tools/size_report.py; its failing stops nothing)
        continue-on-error: true
        run: |
          ELF="$(find app/build -maxdepth 3 -name '*.elf' ! -path '*host*' | grep -v loader | head -1)"
          OD="$HOME/.jieli/toolchain/common/bin/objdump"
          echo "elf: $ELF"
          "$OD" -h "$ELF" > app/build/sections.txt
          "$OD" -t "$ELF" > app/build/symbols.txt
          IMG="$(grep -o 'ok    image [0-9]* B' build.log | grep -o '[0-9][0-9]*' | head -1)"
          /usr/bin/python3 tools/size_report.py app/build/sections.txt app/build/symbols.txt $IMG \
            | tee "app/build/loaf-breaker-test-size-$VERSION.txt"
          { echo '```'; head -60 "app/build/loaf-breaker-test-size-$VERSION.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Screens from the host simulator   # (a scenario failing fails the run: no release of a build that crashes)
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --host --release "$VERSION"   # (the number on its screens too)
          mkdir -p screens
          H="$(ls app/build/host/*_host | head -1)"
          bad=""
          for sc in ui kick64 lanes seq pads subdrive skins arp clap terror cross track fxmem kfx knob halflatch cdj maxout reorg drops reset synth kickmenu kroll hits trkgap mbkick trkfrom loaftest audition kreset drumbig kpreset autosave effects trkempty lfomix wavezoom sfxset sellock trkflt kill kicktools kickknob kickknobs cleanmorph novice; do "$H" tests/scenarios/$sc.txt screens || bad="$bad $sc"; done
          # (LOAF BREAKER: the update loader's screen, its drawing on a stand-in panel)
          cc -std=c99 -Wall -I tests/loader/src tests/loader/src/preview.c -o app/build/ldr_preview \
            && (cd screens && ../app/build/ldr_preview) \
            && /usr/bin/python3 -c 'import sys; from PIL import Image; [Image.open(f"screens/{n}.ppm").save(f"screens/{n}.png") for n in ("ldr_wait", "ldr_0", "ldr_50", "ldr_lost", "ldr_100", "ldr_done")]' \
            && rm -f screens/*.ppm || bad="$bad loader"
          ls screens
          (cd screens && zip -q -r "../app/build/loaf-breaker-test-screens-$VERSION.zip" .)
          [ -z "$bad" ] || { echo "::error::scenarios failed:$bad"; exit 1; }

      - name: Soak (30 minutes of random play in the simulator)   # (a crash, a hang or silence at the end fails the run)
        run: |
          S=$(( ${{ github.run_number }} % 1000 ))
          echo "soak seed $S (again: python3 tools/soak.py --minutes 30 --seed $S)"
          python3 tools/soak.py --minutes 30 --seed $S > app/build/soak.txt
          mkdir -p app/build/soak
          H="$(ls app/build/host/*_host | head -1)"
          rc=0; "$H" app/build/soak.txt app/build/soak > app/build/soak.log 2>&1 || rc=$?
          tail -3 app/build/soak.log; grep FAIL app/build/soak.log || true
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ env.VERSION }}
          path: screens/
          if-no-files-found: ignore

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: LOAF BREAKER TEST ${{ env.VERSION }}
          body: |
            **FIRMWARE DE TEST** (le firmware principal loaf-v… n'est pas touché). Installe loaf-breaker-test-${{ env.VERSION }}.fwsc avec l'installateur web (Chrome ou Edge, le FM-1 en USB) ; le splash affiche ${{ env.VERSION }}. Pour revenir en arrière : réinstalle la dernière loaf-v….

            ## Un compteur pour mesurer, et une interface plus légère

            **METER** (GLO › MORE, **K3** à droite ; pas sauvegardé, éteint au redémarrage) : chaque seconde, l'en-tête affiche
            - **CPU a% PK b%** : la part du temps que prend le son (moyenne et pire moment de la seconde). Au-delà de ~85 % en pic, le son est à la limite ;
            - **IMG n** : les bandes d'image envoyées à l'écran dans la seconde ;
            - **FR n** : combien de fois par seconde l'interface a tourné (lire les boutons, dessiner). Plus c'est haut, plus c'est réactif.

            **Allègements :**
            - la vue CDJ de HOME et les vumètres du mixer passent de 30 à 20 images par seconde ;
            - le kick blanc en direct dans EDIT se redessine 5 fois par seconde au lieu de 8 ;
            - le visuel du kick se recalcule au plus toutes les 100 ms quand tu tournes un knob (le son, lui, change à chaque cran) ;
            - quand tu tournes vite un knob, tous les crans d'un même passage sont appliqués en une fois au lieu d'un par cran.

            ## À faire
            1. Allume METER, lance un morceau, et note **CPU / PK / IMG / FR** sur : HOME (vue CDJ), EDIT (le kick), SEQ, LFO, FX, et pendant un drop. Note aussi pendant que tu tournes vite un knob.
            2. Dis-moi si l'interface te paraît plus fluide qu'en 0.177, et si la vue CDJ à 20 images par seconde te va visuellement.

            Avec ces chiffres je saurai si le deuxième cœur vaut la peine, ou si alléger l'écran suffit.
          generate_release_notes: true
          make_latest: false
          prerelease: true
          files: |
            app/build/loaf-breaker-test-${{ env.VERSION }}.fwsc
            app/build/loaf-breaker-test-screens-${{ env.VERSION }}.zip
            app/build/loaf-breaker-test-size-${{ env.VERSION }}.txt
