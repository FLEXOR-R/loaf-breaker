# GLOUPI BREAKS: CHOPPAH in red, its own name and version on the screens, its own nine breaks (breaks/breaks.txt).
# Every push to the gloupi branch (or Actions → GLOUPI BREAKS → Run workflow) is a release of its own, kept: the last
# gloupi-vX.YY tag + 0.01 (the first 0.02: 0.01 was the "gloupi" pre-release), the number on the splash, the release
# gloupi-vX.YY with gloupi-breaks-X.YY.fwsc and the host simulator's screens (gloupi-screens-X.YY.zip). A re-run of a
# commit already released builds the same number again.
name: GLOUPI BREAKS

on:
  push:
    branches: [gloupi]
  workflow_dispatch:

permissions:
  contents: write

concurrency:                            # one release at a time, in order: no two runs take the same number
  group: gloupi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        run: |
          TAGS="$(git ls-remote --tags origin 'refs/tags/gloupi-v*' | sed 's|\^{}$||')"
          V="$(printf '%s\n' "$TAGS" | grep "^$GITHUB_SHA" | sed 's|.*refs/tags/gloupi-v||' | head -1)"
          if [ -z "$V" ]; then
            LAST="$(printf '%s\n' "$TAGS" | sed -n 's|.*refs/tags/gloupi-v||p' | grep -E '^[0-9]+\.[0-9]{2}$' \
                    | sort -t. -k1,1n -k2,2n | tail -1)"
            if [ -z "$LAST" ]; then
              V=0.02
            else
              MAJ="${LAST%%.*}"; MIN=$((10#${LAST#*.} + 1))
              [ "$MIN" -gt 99 ] && { MAJ=$((MAJ + 1)); MIN=0; }
              V="$(printf '%d.%02d' "$MAJ" "$MIN")"
            fi
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "GLOUPI BREAKS $V" >> "$GITHUB_STEP_SUMMARY"

      - name: Pillow with raqm (the build's fonts)
        run: |
          raqm() { /usr/bin/python3 -c 'from PIL import features; raise SystemExit(not features.check("raqm"))' 2>/dev/null; }
          raqm || /usr/bin/python3 -m pip install -q --user --break-system-packages Pillow
          raqm || { sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0; }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: fm1-base, JieLi toolchain and AC79 SDK files
        env:
          PYTHON: /usr/bin/python3
          BOOTSTRAP_USB: 0
        run: sh scripts/bootstrap.sh

      - name: Engine tests
        run: ./build.sh test

      - name: Firmware
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --release "$VERSION" | tee build.log
          mv "app/build/choppah-$VERSION.fwsc" "app/build/gloupi-breaks-$VERSION.fwsc"
          { echo '```'; grep -i -E 'image|flash|bank|slot' build.log | tail -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Screens from the host simulator
        continue-on-error: true
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --host --release "$VERSION"   # (the number on its screens too)
          mkdir -p screens
          H="$(ls app/build/host/*_host | head -1)"
          for sc in ui kick64 lanes seq pads; do "$H" tests/scenarios/$sc.txt screens || echo "scenario $sc failed"; done
          ls screens
          (cd screens && zip -q -r "../app/build/gloupi-screens-$VERSION.zip" .)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ env.VERSION }}
          path: screens/
          if-no-files-found: ignore

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: gloupi-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: GLOUPI BREAKS ${{ env.VERSION }}
          body: |
            Install gloupi-breaks-${{ env.VERSION }}.fwsc with fm1-base's web installer (Chrome or Edge, the FM-1 on
            USB); the splash shows ${{ env.VERSION }}. gloupi-screens-${{ env.VERSION }}.zip: the simulator's screens.
          generate_release_notes: true
          make_latest: true
          files: |
            app/build/gloupi-breaks-${{ env.VERSION }}.fwsc
            app/build/gloupi-screens-${{ env.VERSION }}.zip
