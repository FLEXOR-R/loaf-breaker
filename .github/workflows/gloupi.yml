# LOAF BREAKER (was GLOUPI BREAKS): CHOPPAH modified by FLEXOR, its own name, screens and nine breaks.
# Every push to the gloupi branch (or Actions → GLOUPI BREAKS → Run workflow) is a release of its own, kept: the last
# gloupi-vX.YY tag + 0.01 (the first 0.02: 0.01 was the "gloupi" pre-release; after 0.99 come 0.100, 0.101 ...: never
# 1.00), the number on the splash, the release
# loaf-vX.YY with loaf-breaker-X.YY.fwsc and the host simulator's screens (loaf-breaker-screens-X.YY.zip). A re-run of a
# commit already released builds the same number again.
name: LOAF BREAKER

on:
  push:
    branches: [gloupi]
    paths-ignore: ["breaks/tests/**", ".github/workflows/tests.yml"]   # (the break tests' own: tests.yml)
  workflow_dispatch:

permissions:
  contents: write

concurrency:                            # one release at a time, in order: no two runs take the same number
  group: gloupi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        run: |
          # (LOAF BREAKER's loaf-vX.YY tags go on from GLOUPI BREAKS' gloupi-vX.YY: one count)
          TAGS="$(git ls-remote --tags origin 'refs/tags/loaf-v*' 'refs/tags/gloupi-v*' | sed 's|\^{}$||')"
          V="$(printf '%s\n' "$TAGS" | grep "^$GITHUB_SHA" | sed 's|.*refs/tags/[a-z]*-v||' | head -1)"
          if [ -z "$V" ]; then
            LAST="$(printf '%s\n' "$TAGS" | sed -n 's|.*refs/tags/[a-z]*-v||p' | grep -E '^[0-9]+\.[0-9]{2,}$' \
                    | sort -t. -k1,1n -k2,2n | tail -1)"
            if [ -z "$LAST" ]; then
              V=0.02
            else
              # (LOAF BREAKER: no 1.00 after 0.99: on to 0.100, 0.101 ...)
              MAJ="${LAST%%.*}"; MIN=$((10#${LAST#*.} + 1))
              V="$(printf '%d.%02d' "$MAJ" "$MIN")"
            fi
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "LOAF BREAKER $V" >> "$GITHUB_STEP_SUMMARY"

      - name: Pillow with raqm (the build's fonts)
        run: |
          raqm() { /usr/bin/python3 -c 'from PIL import features; raise SystemExit(not features.check("raqm"))' 2>/dev/null; }
          raqm || /usr/bin/python3 -m pip install -q --user --break-system-packages Pillow
          raqm || { sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0; }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: fm1-base, JieLi toolchain and AC79 SDK files
        env:
          PYTHON: /usr/bin/python3
          BOOTSTRAP_USB: 0
        run: sh scripts/bootstrap.sh

      - name: Engine tests
        run: ./build.sh test

      - name: Firmware
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --release "$VERSION" | tee build.log
          mv "app/build/choppah-$VERSION.fwsc" "app/build/loaf-breaker-$VERSION.fwsc"
          { echo '```'; grep -i -E 'image|flash|bank|slot' build.log | tail -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Size report   # (LOAF BREAKER: what takes the room, tools/size_report.py; its failing stops nothing)
        continue-on-error: true
        run: |
          ELF="$(find app/build -maxdepth 3 -name '*.elf' ! -path '*host*' | grep -v loader | head -1)"
          OD="$HOME/.jieli/toolchain/common/bin/objdump"
          echo "elf: $ELF"
          "$OD" -h "$ELF" > app/build/sections.txt
          "$OD" -t "$ELF" > app/build/symbols.txt
          IMG="$(grep -o 'ok    image [0-9]* B' build.log | grep -o '[0-9][0-9]*' | head -1)"
          /usr/bin/python3 tools/size_report.py app/build/sections.txt app/build/symbols.txt $IMG \
            | tee "app/build/loaf-breaker-size-$VERSION.txt"
          { echo '```'; head -60 "app/build/loaf-breaker-size-$VERSION.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Screens from the host simulator   # (a scenario failing fails the run: no release of a build that crashes)
        env:
          PYTHON: /usr/bin/python3
        run: |
          ./build.sh --host --release "$VERSION"   # (the number on its screens too)
          mkdir -p screens
          H="$(ls app/build/host/*_host | head -1)"
          bad=""
          for sc in ui kick64 lanes seq pads subdrive skins arp clap terror cross track fxmem kfx knob halflatch cdj; do "$H" tests/scenarios/$sc.txt screens || bad="$bad $sc"; done
          # (LOAF BREAKER: the update loader's screen, its drawing on a stand-in panel)
          cc -std=c99 -Wall -I tests/loader/src tests/loader/src/preview.c -o app/build/ldr_preview \
            && (cd screens && ../app/build/ldr_preview) \
            && /usr/bin/python3 -c 'import sys; from PIL import Image; [Image.open(f"screens/{n}.ppm").save(f"screens/{n}.png") for n in ("ldr_wait", "ldr_0", "ldr_50", "ldr_lost", "ldr_100", "ldr_done")]' \
            && rm -f screens/*.ppm || bad="$bad loader"
          ls screens
          (cd screens && zip -q -r "../app/build/loaf-breaker-screens-$VERSION.zip" .)
          [ -z "$bad" ] || { echo "::error::scenarios failed:$bad"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ env.VERSION }}
          path: screens/
          if-no-files-found: ignore

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: loaf-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: LOAF BREAKER ${{ env.VERSION }}
          body: |
            Install loaf-breaker-${{ env.VERSION }}.fwsc with fm1-base's web installer (Chrome or Edge, the FM-1 on
            USB); the splash shows ${{ env.VERSION }}. loaf-breaker-screens-${{ env.VERSION }}.zip: the simulator's
            screens.
          generate_release_notes: true
          make_latest: true
          files: |
            app/build/loaf-breaker-${{ env.VERSION }}.fwsc
            app/build/loaf-breaker-screens-${{ env.VERSION }}.zip
            app/build/loaf-breaker-size-${{ env.VERSION }}.txt
