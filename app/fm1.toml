# LOAF BREAKER's build settings (fm1-base's tools/build.py: ./build.sh). LOAF BREAKER is FLEXOR's fork of CHOPPAH
# (Laurens Profittlich, https://github.com/profikid/fm1-break-choppah): its own name, files and identity, CHOPPAH credited
name = "LOAF-BREAKER"          # the build's files: loaf-breaker.fwsc, loaf-breaker-X.Y.fwsc, loaf-breaker_host (CHOPPAH's: choppah)
id_prefix = "FM-1_2623"        # package identity, its own (CHOPPAH's: FM-1_86): dev FM-1_262300, releases FM-1_2623XXYYZZ;
                               # free on the Firmware Hub's catalogue, 9 Nov 2026 (no identity there starts 2623)
usb_manufacturer = "LOAF BREAKER"
usb_product = "LOAF BREAKER FM-1"     # LOAF BREAKER: "FM-1" kept in the name, so the installer and the tools find the port by themselves
ble = false                    # GLOUPI BREAKS: no Bluetooth (CHOPPAH: true, Bluetooth MIDI, PRD A-71)
ble_stack = "own"              # fm1-base's own stack: nothing of JieLi's, ~40 KB
bt_audio = false               # GLOUPI BREAKS: no Bluetooth audio out (CHOPPAH: true, PRD A-72)
usb_audio_in = true            # the FM-1 recordable over USB (PRD A-50)
usb_audio_out = false
midi_stamp = true             # LOAF BREAKER: MIDI in (the clock) stamped where it lands, USB and TRS (fm1-base)
words = "words.tsv"
font_trim = true               # LOAF BREAKER: each glyph stored as its lit box (the same pixels, the fonts ~55 % smaller);
                               # the unused faces (S, M, L: base's sys_text, APP_SYS_TEXT here) are left out by the
                               # compiler, being static and never read
include = ["dsp"]
o2 = ["dsp/*.c"]               # the engine, at -O2
unity_opt = "z"                # the platform and the UI at -Oz (the engine stays -O2): smaller
boot_pack = true               # the start-up's RAM images stored LZMA-packed: smaller
# the site (tools/make_site.py)
title = "LOAF BREAKER"         # the name people see (firmware.json; the site: tools/site_style.py)
install_app = "site/install_app.js"   # confetti when the install is done
tagline = "A hardcore break chopper for the FM-1"
repo = "https://github.com/FLEXOR-R/loaf-breaker"   # LOAF BREAKER (CHOPPAH: https://github.com/profikid/fm1-break-choppah)
licence = "MPL-2.0"
credits = "Built on CHOPPAH by Laurens Profittlich, on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
# firmware.json (required by fm1-base for a --release build: the releases of loaf.yml)
author = "FLEXOR (LOAF BREAKER), from CHOPPAH by Laurens Profittlich"
description = "LOAF BREAKER is FLEXOR's CHOPPAH: a hardcore break chopper for the M-VAVE FM-1, kicks and drums only: its own breaks, a kick with its own menu, synth, DISTO, SCREAM and KICK LAB (a clean tail, its note, STACK layering), a snare, a hat and a clap, a 64-step sequencer with conditions, 64 patterns, tracks with built-up drops, a compressor, skins and a steady MIDI clock in over the TRS jack."
tags = ["drum-machine", "sampler"]
install = "https://charlesvestal.github.io/fm1-base/install/"
screenshot = "docs/img/loaf_breaker_card.png"
